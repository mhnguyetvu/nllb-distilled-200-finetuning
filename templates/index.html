<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLLB Premium Translator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.15) 0px, transparent 50%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        header {
            margin-bottom: 3rem;
            text-align: center;
        }

        h1 {
            font-family: 'Outfit', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            position: relative;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        .card:hover {
            border-color: rgba(99, 102, 241, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        select {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            outline: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        select:focus {
            border-color: var(--primary);
        }

        textarea {
            width: 100%;
            height: 200px;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 1.25rem;
            resize: none;
            outline: none;
            line-height: 1.6;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        .output-text {
            width: 100%;
            height: 200px;
            font-size: 1.25rem;
            line-height: 1.6;
            color: var(--text);
            white-space: pre-wrap;
            overflow-y: auto;
        }

        .output-text:empty::before {
            content: "Translation will appear here...";
            color: var(--text-muted);
        }

        .translate-btn {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: var(--primary);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 10;
        }

        .translate-btn:hover {
            background: var(--primary-hover);
            transform: translate(-50%, -50%) scale(1.1) rotate(180deg);
        }

        .translate-btn svg {
            width: 30px;
            height: 30px;
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .translate-btn {
                position: relative;
                left: 0;
                top: 0;
                transform: none;
                margin: 1rem auto;
            }
            .translate-btn:hover {
                transform: scale(1.1) rotate(180deg);
            }
        }

        footer {
            margin-top: auto;
            padding: 2rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>NLLB Translator</h1>
        <p class="subtitle">Neural Machine Translation powered by ONNX</p>
    </header>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <select id="srcLang">
                    <option value="vie_Latn">Vietnamese</option>
                    <option value="kor_Hang">Korean</option>
                    <option value="eng_Latn">English</option>
                </select>
                <span style="color: var(--text-muted); font-size: 0.8rem">Source</span>
            </div>
            <textarea id="srcText" placeholder="Enter text to translate..."></textarea>
        </div>

        <button class="translate-btn" id="translateBtn">
            <svg id="arrowIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path>
            </svg>
            <div class="loading" id="loader"></div>
        </button>

        <div class="card">
            <div class="card-header">
                <select id="tgtLang">
                    <option value="kor_Hang">Korean</option>
                    <option value="vie_Latn">Vietnamese</option>
                    <option value="eng_Latn">English</option>
                </select>
                <span style="color: var(--text-muted); font-size: 0.8rem">Target</span>
            </div>
            <div class="output-text" id="tgtText"></div>
        </div>
    </div>

    <footer>
        Built with FastAPI & Optimum ONNX Runtime
    </footer>

    <script>
        const srcText = document.getElementById('srcText');
        const tgtText = document.getElementById('tgtText');
        const srcLang = document.getElementById('srcLang');
        const tgtLang = document.getElementById('tgtLang');
        const translateBtn = document.getElementById('translateBtn');
        const arrowIcon = document.getElementById('arrowIcon');
        const loader = document.getElementById('loader');

        async function performTranslation() {
            const text = srcText.value.trim();
            if (!text) {
                tgtText.innerText = "";
                return;
            }

            // Show loading
            arrowIcon.style.display = "none";
            loader.style.display = "block";
            translateBtn.disabled = true;

            try {
                const response = await fetch('/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        text: text,
                        src_lang: srcLang.value,
                        tgt_lang: tgtLang.value
                    }),
                });

                const data = await response.json();
                if (data.translated_text) {
                    tgtText.innerText = data.translated_text;
                } else if (data.error) {
                    tgtText.innerText = "Error: " + data.error;
                }
            } catch (err) {
                tgtText.innerText = "Error: " + err.message;
            } finally {
                // Hide loading
                arrowIcon.style.display = "block";
                loader.style.display = "none";
                translateBtn.disabled = false;
            }
        }

        // Debounce translation
        let timeout = null;
        srcText.addEventListener('input', () => {
            clearTimeout(timeout);
            timeout = setTimeout(performTranslation, 1000);
        });

        translateBtn.addEventListener('click', performTranslation);
    </script>
</body>
</html>
